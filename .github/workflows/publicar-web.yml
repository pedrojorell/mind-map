# Publica a versão web do MapLong no GitHub Pages a cada atualização do main.
# Endereço: https://<usuario>.github.io/<repositorio>/
# Ative uma vez em: Settings > Pages > Build and deployment > Source: GitHub Actions
name: Publicar versão web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise do código
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Compilar a versão web
        run: >-
          flutter build web --release --no-tree-shake-icons
          --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
