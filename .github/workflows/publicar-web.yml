# Publica o site de vendas (pasta site/) no GitHub Pages a cada atualização
# do main. Endereço: https://<usuario>.github.io/<repositorio>/
#
# Opcional: para publicar também a versão do MapLong para navegador em
# https://<usuario>.github.io/<repositorio>/app/, crie a variável
# PUBLICAR_APP_WEB com o valor true em:
#   Settings > Secrets and variables > Actions > Variables > New repository variable
#
# Ative o Pages uma vez em: Settings > Pages > Build and deployment >
# Source: GitHub Actions. Passo a passo: docs/SITE_DE_VENDAS.md
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLICAR_APP_WEB: ${{ vars.PUBLICAR_APP_WEB }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        if: env.PUBLICAR_APP_WEB == 'true'
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Compilar a versão para navegador
        if: env.PUBLICAR_APP_WEB == 'true'
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons \
            --base-href "/${{ github.event.repository.name }}/app/"

      - name: Montar o site
        run: |
          mkdir -p publicar
          cp -r site/. publicar/
          if [ -d build/web ]; then
            mkdir -p publicar/app
            cp -r build/web/. publicar/app/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
