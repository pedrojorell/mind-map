name: maplong
description: MapLong - mapas mentais que funcionam offline e salvam seus documentos localmente.
publish_to: "none"
version: 2.1.0+4

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  file_picker: ^10.3.9
  url_launcher: ^6.3.0
  vector_math: ^2.1.4
  desktop_drop: ^0.8.4
  cross_file: ^0.3.5+5
  pdf: ^3.12.0
  xml: ^6.6.1
  flutter_math_fork: ^0.7.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
